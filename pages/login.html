<!DOCTYPE html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | TIPECO GROUP</title>

    <link rel="stylesheet" href="auth.css">

</head>

<body>

    <!-- =====================================================
         LOGIN PAGE
    ====================================================== -->

    <main class="auth-page">

        <div class="auth-container">

            <!-- Logo / Brand -->
            <div class="auth-header">

                <a href="../index.html"
                   class="auth-logo">
                    TIPECO GROUP
                </a>

                <h1>Welcome Back</h1>

                <p>
                    Login to your TIPECO GROUP account
                </p>

            </div>


            <!-- Login Card -->
            <div class="auth-card">

                <form action="#" method="post">

                    <!-- Email / Phone -->
                    <div class="form-group">

                        <label for="login">
                            Email or Phone Number
                        </label>

                        <input
                            type="text"
                            id="login"
                            name="login"
                            placeholder="Enter your email or phone"
                            autocomplete="username"
                            required
                        >

                    </div>


                    <!-- Password -->
                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <!-- Remember + Forgot -->
                    <div class="auth-options">

                        <label class="remember-me">

                            <input
                                type="checkbox"
                                name="remember"
                            >

                            <span>Remember me</span>

                        </label>


                        <a href="forgot-password.html">
                            Forgot Password?
                        </a>

                    </div>


                    <!-- Login Button -->
                    <button
                        type="submit"
                        class="auth-btn">
                        Login
                    </button>


                    <!-- Divider -->
                    <div class="auth-divider">

                        <span>OR</span>

                    </div>


                    <!-- Google Login -->
                    <button
                        type="button"
                        class="google-btn">

                        <span class="google-icon">
                            G
                        </span>

                        Continue with Google

                    </button>


                </form>


                <!-- Register -->
                <div class="auth-register">

                    <p>
                        Don't have an account?
                        <a href="register.html">
                            Sign Up
                        </a>
                    </p>

                </div>

            </div>


            <!-- Back Home -->
            <div class="back-home">

                <a href="../index.html">
                    ← Back to TIPECO GROUP
                </a>

            </div>

        </div>

    </main>


</body>

</html>
