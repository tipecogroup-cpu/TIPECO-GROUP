<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =====================================================
         TIPECO GROUP - LOGIN PAGE
    ====================================================== -->

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Login to TIPECO GROUP">

    <meta name="theme-color"
          content="#0D47A1">

    <title>Login | TIPECO GROUP</title>


    <!-- TIPECO GROUP AUTH CSS -->

    <link rel="stylesheet"
          href="../assets/css/auth.css">

</head>


<body>


    <!-- =====================================================
         TIPECO GROUP - LOGIN PAGE
    ====================================================== -->

    <main class="auth-page">

        <div class="auth-container">


            <!-- =================================================
                 BRAND
            ================================================== -->

            <div class="auth-header">

                <a href="../index.html"
                   class="auth-logo">

                    TIPECO GROUP

                </a>


                <h1>
                    Welcome Back
                </h1>


                <p>
                    Login to your TIPECO GROUP account
                </p>

            </div>



            <!-- =================================================
                 LOGIN CARD
            ================================================== -->

            <div class="auth-card">

                <form
    id="loginForm">


                    <!-- EMAIL / PHONE -->

                    <div class="form-group">

                        <label for="login">

                            Email or Phone Number

                        </label>


                        <input
                            type="text"
                            id="login"
                            name="identifier"
                            placeholder="Enter your email or phone"
                            autocomplete="username"
                            required>

                    </div>



                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="password">

                            Password

                        </label>


                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>

                    </div>



                    <!-- REMEMBER / FORGOT -->

                    <div class="auth-options">


                        <label class="remember-me">

                            <input
                                type="checkbox"
                                name="remember">

                            <span>
                                Remember me
                            </span>

                        </label>



                        <a href="forgot-password.html">

                            Forgot Password?

                        </a>


                    </div>



                    <!-- LOGIN BUTTON -->

                    <button
                        type="submit"
                        class="auth-btn">

                        Login

                    </button>



                    <!-- DIVIDER -->

                    <div class="auth-divider">

                        <span>
                            OR
                        </span>

                    </div>



                    <!-- GOOGLE LOGIN -->

                    <button
                        type="button"
                        class="google-btn">


                        <span class="google-icon">

                            G

                        </span>


                        <span>

                            Continue with Google

                        </span>


                    </button>


                </form>



                <!-- =================================================
                     SIGN UP
                ================================================== -->

                <div class="auth-register">

                    <p>

                        Don't have an account?

                        <a href="register.html">

                            Sign Up

                        </a>

                    </p>

                </div>


            </div>



            <!-- =================================================
                 BACK HOME
            ================================================== -->

            <div class="back-home">

                <a href="../index.html">

                    ← Back to TIPECO GROUP

                </a>

            </div>


        </div>

    </main>



    <!-- =====================================================
         TIPECO GROUP AUTH JAVASCRIPT
    ====================================================== -->

   <script src="../assets/js/auth.js"></script> 


</body>

</html>
