<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =====================================================
         TIPECO GROUP - FORGOT PASSWORD
    ====================================================== -->

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Reset your TIPECO GROUP account password">

    <meta name="author"
          content="TIPECO GROUP">

    <meta name="theme-color"
          content="#0D47A1">

    <title>Forgot Password | TIPECO GROUP</title>

    <!-- TIPECO GROUP AUTH CSS -->
    <link rel="stylesheet"
          href="../assets/css/auth.css">

</head>


<body>

    <!-- =====================================================
         FORGOT PASSWORD PAGE
    ====================================================== -->

    <main class="auth-page">

        <div class="auth-container">


            <!-- =================================================
                 AUTH HEADER
            ================================================== -->

            <div class="auth-header">

                <a href="../index.html"
                   class="auth-logo">

                    TIPECO GROUP

                </a>


                <h1>
                    Forgot Password?
                </h1>


                <p>
                    Reset your TIPECO GROUP account password
                </p>

            </div>


            <!-- =================================================
                 FORGOT PASSWORD CARD
            ================================================== -->

            <div class="auth-card">

                <form action="#"
                      method="post">


                    <!-- Information -->

                    <div class="form-group">

                        <p style="
                            color: #757575;
                            font-size: 14px;
                            line-height: 1.6;
                            margin-bottom: 20px;
                        ">

                            Enter your email address or phone number
                            and we will help you reset your password.

                        </p>

                    </div>


                    <!-- Email / Phone -->

                    <div class="form-group">

                        <label for="login">

                            Email or Phone Number

                        </label>


                        <input
                            type="text"
                            id="login"
                            name="login"
                            placeholder="Enter your email or phone"
                            autocomplete="username"
                            required
                        >

                    </div>


                    <!-- Reset Button -->

                    <button
                        type="submit"
                        class="auth-btn">

                        Send Reset Link

                    </button>


                    <!-- Divider -->

                    <div class="auth-divider">

                        <span>OR</span>

                    </div>


                    <!-- Back to Login -->

                    <div style="
                        text-align: center;
                    ">

                        <a
                            href="login.html"
                            style="
                                color: var(--primary-color);
                                font-size: 14px;
                                font-weight: 700;
                            ">

                            ← Back to Login

                        </a>

                    </div>


                </form>


                <!-- =================================================
                     REGISTER
                ================================================== -->

                <div class="auth-register">

                    <p>

                        Don't have an account?

                        <a href="register.html">

                            Sign Up

                        </a>

                    </p>

                </div>

            </div>


            <!-- =================================================
                 BACK HOME
            ================================================== -->

            <div class="back-home">

                <a href="../index.html">

                    ← Back to TIPECO GROUP

                </a>

            </div>


        </div>

    </main>
<script src="../js/auth.js"></script>

</body>

</html>
