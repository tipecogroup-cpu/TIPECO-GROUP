<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =====================================================
         TIPECO GROUP - RESET PASSWORD
    ====================================================== -->

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Reset your TIPECO GROUP account password">

    <meta name="author"
          content="TIPECO GROUP">

    <meta name="theme-color"
          content="#0D47A1">

    <title>Reset Password | TIPECO GROUP</title>


    <!-- TIPECO GROUP AUTH CSS -->

    <link rel="stylesheet"
          href="../assets/css/auth.css">

</head>


<body>


    <!-- =====================================================
         TIPECO GROUP - RESET PASSWORD PAGE
    ====================================================== -->

    <main class="auth-page">

        <div class="auth-container">


            <!-- =================================================
                 AUTH HEADER
            ================================================== -->

            <div class="auth-header">

                <a href="../index.html"
                   class="auth-logo">

                    TIPECO GROUP

                </a>


                <h1>
                    Reset Password
                </h1>


                <p>
                    Create a new password for your TIPECO GROUP account
                </p>

            </div>



            <!-- =================================================
                 RESET PASSWORD CARD
            ================================================== -->

            <div class="auth-card">

                <form
                    id="resetPasswordForm"
                    action="javascript:void(0);"
                    method="post">


                    <!-- NEW PASSWORD -->

                    <div class="form-group">

                        <label for="newPassword">

                            New Password

                        </label>


                        <input
                            type="password"
                            id="newPassword"
                            name="newPassword"
                            placeholder="Enter your new password"
                            autocomplete="new-password"
                            required>

                    </div>



                    <!-- CONFIRM PASSWORD -->

                    <div class="form-group">

                        <label for="confirmNewPassword">

                            Confirm New Password

                        </label>


                        <input
                            type="password"
                            id="confirmNewPassword"
                            name="confirmNewPassword"
                            placeholder="Confirm your new password"
                            autocomplete="new-password"
                            required>

                    </div>



                    <!-- PASSWORD INFORMATION -->

                    <div class="form-group">

                        <p style="
                            color: #757575;
                            font-size: 14px;
                            line-height: 1.6;
                            margin-bottom: 20px;
                        ">

                            Your password must contain at least
                            6 characters.

                        </p>

                    </div>



                    <!-- RESET BUTTON -->

                    <button
                        type="submit"
                        class="auth-btn">

                        Reset Password

                    </button>



                    <!-- DIVIDER -->

                    <div class="auth-divider">

                        <span>
                            OR
                        </span>

                    </div>



                    <!-- BACK TO LOGIN -->

                    <div style="
                        text-align: center;
                    ">

                        <a
                            href="login.html"
                            style="
                                color: var(--primary-color);
                                font-size: 14px;
                                font-weight: 700;
                            ">

                            ← Back to Login

                        </a>

                    </div>


                </form>



                <!-- REGISTER -->

                <div class="auth-register">

                    <p>

                        Don't have an account?

                        <a href="register.html">

                            Sign Up

                        </a>

                    </p>

                </div>

            </div>



            <!-- BACK HOME -->

            <div class="back-home">

                <a href="../index.html">

                    ← Back to TIPECO GROUP

                </a>

            </div>


        </div>

    </main>



    <!-- TIPECO GROUP AUTH JAVASCRIPT -->

    <script src="../assets/js/auth.js"></script>


</body>

</html>
