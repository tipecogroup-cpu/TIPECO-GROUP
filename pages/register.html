<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =====================================================
         TIPECO GROUP - REGISTER PAGE
    ====================================================== -->

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Create your TIPECO GROUP account">

    <meta name="author"
          content="TIPECO GROUP">

    <meta name="theme-color"
          content="#0D47A1">

    <title>Sign Up | TIPECO GROUP</title>

    <!-- CSS -->
    <link rel="stylesheet"
          href="../assets/css/variables.css">

    <link rel="stylesheet"
          href="../assets/css/style.css">

    <link rel="stylesheet"
          href="../assets/css/responsive.css">

    <link rel="stylesheet"
          href="../assets/css/animations.css">

    <link rel="stylesheet"
          href="../assets/css/auth.css">

</head>


<body>

    <!-- =====================================================
         REGISTER PAGE
    ====================================================== -->

    <main class="auth-page">

        <div class="auth-container">

            <!-- Brand Header -->
            <div class="auth-header">

                <a href="../index.html"
                   class="auth-logo">
                    TIPECO GROUP
                </a>

                <h1>Create Account</h1>

                <p>
                    Join TIPECO GROUP and explore our services
                </p>

            </div>


            <!-- Register Card -->
            <div class="auth-card">

                <form action="#" method="post">

                    <!-- Full Name -->
                    <div class="form-group">

                        <label for="fullname">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="fullname"
                            name="fullname"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required
                        >

                    </div>


                    <!-- Email -->
                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <!-- Phone -->
                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter your phone number"
                            autocomplete="tel"
                            required
                        >

                    </div>


                    <!-- Password -->
                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required
                        >

                    </div>


                    <!-- Confirm Password -->
                    <div class="form-group">

                        <label for="confirm-password">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            required
                        >

                    </div>


                    <!-- Terms -->
                    <div class="auth-options">

                        <label class="remember-me">

                            <input
                                type="checkbox"
                                name="terms"
                                required
                            >

                            <span>
                                I agree to the Terms & Privacy Policy
                            </span>

                        </label>

                    </div>


                    <!-- Register Button -->
                    <button
                        type="submit"
                        class="auth-btn">
                        Create Account
                    </button>


                    <!-- Divider -->
                    <div class="auth-divider">

                        <span>OR</span>

                    </div>


                    <!-- Google Sign Up -->
                    <button
                        type="button"
                        class="google-btn">

                        <span class="google-icon">
                            G
                        </span>

                        Continue with Google

                    </button>

                </form>


                <!-- Login Link -->
                <div class="auth-register">

                    <p>
                        Already have an account?
                        <a href="login.html">
                            Login
                        </a>
                    </p>

                </div>

            </div>


            <!-- Back Home -->
            <div class="back-home">

                <a href="../index.html">
                    ← Back to TIPECO GROUP
                </a>

            </div>

        </div>

    </main>
<script src="../js/auth.js"></script>

</body>

</html>
